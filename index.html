<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060609">
  <meta name="description" content="L'Atelier · The Digital Culinary Workshop, Academy, Flavor Laboratory, and Interactive Gastronomy Workspace.">
  <title>L’Atelier · The Digital Culinary Workshop & Academy</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="latelier.css">
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <!-- Global Application Header -->
  <header class="app-header">
    <a href="index.html" class="brand-container" aria-label="L'Atelier Home">
      <div class="brand-monogram">L</div>
      <div class="brand-title">
        <span class="brand-name">L’Atelier</span>
        <span class="brand-tagline">Atelier Culinaire & Académie</span>
      </div>
    </a>

    <!-- Primary Nav Pills -->
    <nav class="primary-nav" aria-label="Main Culinary Navigation">
      <button class="nav-pill active" data-view="discovery">
        <span>✦</span> Discovery & Menu
      </button>
      <button class="nav-pill" data-view="recipes">
        <span>📖</span> Recipe Library
      </button>
      <button class="nav-pill" data-view="flavor">
        <span>🧪</span> The Flavor Lab
      </button>
      <button class="nav-pill" data-view="mise">
        <span>⏱</span> Mise en Place
      </button>
      <button class="nav-pill" data-view="academy">
        <span>🎓</span> Academy
      </button>
      <button class="nav-pill" data-view="science">
        <span>🔬</span> Food Science
      </button>
      <button class="nav-pill" data-view="palate">
        <span>🍏</span> Palate Cleansing
      </button>
      <button class="nav-pill" data-view="tools">
        <span>🛠</span> Studio & Tools
      </button>
      <button class="nav-pill" data-view="notebook">
        <span>★</span> Recipe Box
      </button>
      <button class="nav-pill" data-view="shopping">
        <span>🛒</span> Provisions
      </button>
    <button class="nav-pill" data-view="techniques">Techniques</button><button class="nav-pill" data-view="botanicals">Botanical Guide</button></nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" title="Toggle Obsidian/Ivory Theme" aria-label="Toggle Theme">
        ☼
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main id="main-viewport" class="app-viewport" role="main">
    <!-- Dynamic Views rendered by latelier.js -->
  </main>

  <!-- Culinary Datasets & Application Logic -->
  <script src="data-recipes.js"></script>
  <script src="data-flavor.js"></script>
  <script src="data-academy.js"></script>
  <script src="data-science.js"></script>
  <script src="data-encyclopedia.js"></script>
  <script src="data-mastery.js"></script>
  <script src="mastery.js"></script>
  <script src="latelier.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
<a href="vault.html" style="display:block;text-align:center;padding:24px" aria-label="Private workspace">L · Private workspace</a>
</body>
</html>
