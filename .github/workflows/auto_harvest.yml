name: Recipe data review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline validation dependencies
        run: pip install -r ingestion/requirements.txt
      - name: Validate catalog schema and integrity
        run: python -m ingestion.pipeline validate recipes.json
      - name: Test ingestion safeguards
        run: python -m unittest ingestion.test_pipeline
