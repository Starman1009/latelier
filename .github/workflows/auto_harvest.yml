name: L'Atelier Autonomous Recipe Harvester

on:
  schedule:
    - cron: '0 6 * * 0' # Runs automatically every Sunday at 6:00 AM UTC
  workflow_dispatch:     # Lets you trigger it manually with 1 click on GitHub

permissions:
  contents: write

jobs:
  harvest-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Super Harvester & Database Auditor
        run: |
          python super_harvest.py
          python audit_database.py

      - name: Commit & Deploy Updated Catalog
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "L'Atelier Auto-Harvester"
          git add recipes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated harvest: expanded & audited recipe corpus" && git push)